# RedHatAI Gemma 4 26B-A4B-IT (FP8 pre-quantized, compressed-tensors) on GB10 / DGX Spark via SGLang.
#   HF_TOKEN=hf_xxx docker compose up
services:
  redhatai-gemma4-26b-a4b-q8-it-sglang:
    image: picopapaya/redhatai-gemma4-26b-a4b-q8-it-sglang:latest
    container_name: redhatai-gemma4-26b-a4b-q8-it-sglang
    restart: unless-stopped
    ipc: host               # SGLang needs a large shared-memory segment.
    shm_size: "32gb"
    environment:
      HF_TOKEN: "${HF_TOKEN:?Set HF_TOKEN — Gemma 4 is gated}"
      MODEL_ID: "RedHatAI/gemma-4-26B-A4B-it-FP8-Dynamic"
      QUANTIZATION: "compressed-tensors"
      KV_CACHE_DTYPE: "fp8_e4m3"
      CONTEXT_LEN: "${CONTEXT_LEN:-262144}"
      MEM_FRACTION: "${MEM_FRACTION:-0.85}"
      MAX_RUNNING_REQUESTS: "4"
      # EXTRA_ARGS: "--enable-dp-attention --disable-cuda-graph"  # multi-Spark workaround
    volumes:
      - hf-cache:/root/.cache/huggingface
    networks:
      - llm-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  hf-cache:

networks:
  llm-net:
    external: true
    name: llm-net
